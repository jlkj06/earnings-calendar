name: Update earnings calendar

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch:         # lets you run it manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance rich
      - run: python earnings_calendar.py --html --quiet --months 3
      # Fail (and keep the previous published page) if Yahoo returned almost nothing
      - run: python -c "import json; d=json.load(open('earnings_cache.json')); n=sum(1 for v in d.values() if v.get('date')); print(n,'dates found'); assert n>=5"
      - run: mkdir site && cp earnings_calendar.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
